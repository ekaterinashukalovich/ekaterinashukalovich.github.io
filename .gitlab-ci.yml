image: python:3.13

cache:
  paths:
    - .pip/
  key: "$CI_COMMIT_REF_SLUG"

stages:
  - build
  - deploy

install-dependencies:
  stage: build
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .pip -r requirements.txt
  artifacts:
    paths:
      - .pip/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-site:
  stage: build
  script:
    # 🔧 Явно переходим в корень проекта (переменная GitLab CI)
    - cd $CI_PROJECT_DIR
    
    # 🔍 Отладка (можно убрать позже)
    - echo "🔍 DEBUG: pwd = $(pwd)"
    - ls -la mkdocs.yml  # покажет, видит ли файл
    
    # 🔧 Сборка с явным указанием пути к конфигу
    - mkdocs build -f $CI_PROJECT_DIR/mkdocs.yml -d $CI_PROJECT_DIR/public
    
  artifacts:
    paths:
      - public/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - install-dependencies
    
artifacts:
    paths:
      - public/
    expire_in: 1 week
rules:
    - if: $CI_COMMIT_BRANCH == "main"
needs:
    - install-dependencies

pages:
  stage: deploy
  script:
    - echo "🚀 Deploying to SourceCraft Pages..."
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-site