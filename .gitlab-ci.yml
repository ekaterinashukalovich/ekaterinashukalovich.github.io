image: python:3.13

cache:
  paths:
    - .pip/
  key: "$CI_COMMIT_REF_SLUG"

stages:
  - build
  - deploy

install-dependencies:
  stage: build
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .pip -r requirements.txt
  artifacts:
    paths:
      - .pip/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build-site:
  stage: build
  script:
    # 🔍 ОТЛАДКА — не удаляйте эти строки!
    - echo "🔍 DEBUG: Текущая директория:"
    - pwd
    - echo "🔍 DEBUG: Файлы в директории:"
    - ls -la
    - echo "🔍 DEBUG: Ищем mkdocs.yml:"
    - find . -maxdepth 2 -name "mkdocs*" -type f
    - echo "🔍 DEBUG: Проверка файла:"
    - test -f mkdocs.yml && echo "✅ mkdocs.yml НАЙДЕН" || echo "❌ mkdocs.yml НЕ НАЙДЕН"
    
    # 🔧 Сборка (если файл найден)
    - mkdocs build -d ./public
    
  artifacts:
    paths:
      - public/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - install-dependencies

pages:
  stage: deploy
  script:
    - echo "🚀 Deploying to SourceCraft Pages..."
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-site