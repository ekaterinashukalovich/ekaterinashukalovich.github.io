image: python:3.13

build:
  stage: build
  script:
    - echo "=== START BUILD ==="
    - echo "Current directory: $(pwd)"
    - echo "Files:"
    - ls -la
    - echo "Looking for mkdocs.yml:"
    - find . -name "mkdocs*"
    - pip install -r requirements.txt
    - mkdocs build -d ./public
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  script:
    - echo "Deploying..."
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"