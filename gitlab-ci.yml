image: python:3.13

# Кэширование pip-зависимостей для ускорения сборок
cache:
  paths:
    - .pip/
  key: "$CI_COMMIT_REF_SLUG"

stages:
  - build
  - deploy

# Установка зависимостей (отдельный шаг для кэширования)
install-dependencies:
  stage: build
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .pip -r requirements.txt
  artifacts:
    paths:
      - .pip/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Сборка сайта MkDocs
build-site:
  stage: build
  script:
    - mkdocs build -f mkdocs.yaml -d ./public
  artifacts:
    paths:
      - public/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - install-dependencies

# Публикация на SourceCraft Pages
pages:
  stage: deploy
  script:
    - echo "🚀 Deploying to SourceCraft Pages..."
    - ls -la public/  # для отладки
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - build-site